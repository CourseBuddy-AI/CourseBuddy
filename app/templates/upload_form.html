{# 上傳表單（林）。由 dashboard.html include。檔案類型限制在伺服器端，accept 只是方便挑檔。 #}
<form method="post" action="{{ url_for('upload.upload_form') }}" enctype="multipart/form-data" class="upload">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>講義標題（可留空，預設用檔名）
    <input type="text" name="title" maxlength="100">
  </label>
  <label>PDF 檔
    <input type="file" name="file" accept=".pdf,application/pdf" required>
  </label>
  <p class="muted small">
    只接受有文字層的 PDF，最大 {{ (config.UPLOAD_MAX_BYTES // 1048576) or 1 }} MB、{{ config.UPLOAD_MAX_PAGES }} 頁。
  </p>
  <button class="btn primary">上傳</button>
</form>
